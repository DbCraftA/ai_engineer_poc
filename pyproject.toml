[project]
name = "ai-engineer-poc"
version = "0.1.0"
description = "Educational Qwen inference engine POC across CPU, CUDA and Spyre backends."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Wenovat" }
]
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "accelerate>=0.33",
  "safetensors>=0.4.5",
  "huggingface-hub>=0.24",
  "tokenizers>=0.20",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
  "slow: tests that download or run full Hugging Face models",
  "hf: tests that depend on Hugging Face Transformers or Hub access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
