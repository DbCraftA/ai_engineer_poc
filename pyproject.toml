[project]
name = "inference-lab"
version = "0.1.0"
description = "Educational laboratory for LLM inference, PyTorch, GPU computing and inference engines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Wenovat" }
]
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "accelerate>=0.33",
  "safetensors>=0.4.5",
  "huggingface-hub>=0.24",
  "tokenizers>=0.20",
  "numpy>=1.26",
  "tqdm>=4.66",
  "pytest>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyter>=1.1",
]
gpu = [
  "triton>=3.0; platform_system == 'Linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --import-mode=importlib"
markers = [
  "tdd: roadmap TDD specification",
  "cpu: CPU-only test",
  "gpu: requires GPU",
  "cuda: requires CUDA",
  "triton: requires Triton and CUDA",
  "slow: long-running test",
  "hf: tests that depend on Hugging Face Transformers or Hub access",
  "model: model-level test",
  "integration: integration test",
  "perf: performance-related test",
  "distributed: distributed execution",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
